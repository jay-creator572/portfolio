  <div class="aurora"></div>
  <div class="beams"><i></i><i></i><i></i></div>

  <svg class="caustics" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1000 300">
    <filter id="caustic-f" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.018" numOctaves="2" seed="7" result="n">
        <animate attributeName="baseFrequency" dur="24s" values="0.006 0.018;0.008 0.015;0.006 0.018" repeatCount="indefinite"/>
      </feTurbulence>
      <feColorMatrix type="matrix" values="0 0 0 0 0.86  0 0 0 0 0.92  0 0 0 0 1  0 0 0 1 0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0 0 0 0 0.1 1 0.1 0 0 0 0 0"/></feComponentTransfer>
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
    <rect width="1000" height="300" filter="url(#caustic-f)"/>
  </svg>
  <canvas id="bubbles"></canvas>
  <div class="butterflies" id="butterflies"></div>
  <div class="vignette"></div>
</div>
